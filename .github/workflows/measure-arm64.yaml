name: Measure arm64 build (throwaway, do not merge)

on:
  workflow_dispatch:

jobs:
  measure:
    name: Build (linux/amd64 + linux/arm64, QEMU, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - id: checkout
        name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - id: setup-qemu
        name: Set Up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          cache-image: false

      - id: setup
        name: Setup Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - id: build
        name: Build Tracker Image
        uses: docker/build-push-action@v7.4.0
        with:
          file: ./Containerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: false

      - id: disk
        name: Report disk usage
        if: always()
        run: df -h /
